# Render blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo, then New → Blueprint on Render and pick it.
services:
  - type: web
    name: strix-snax-store
    runtime: node
    plan: starter          # free tier sleeps, which stops the bot polling
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # PUBLIC_URL must be the https URL Render gives this service.
      - key: PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: PAYNOW_PROXY_TYPE
        value: mobile
      - key: PAYNOW_PROXY_VALUE
        sync: false
      - key: PAYNOW_MERCHANT_NAME
        value: STRIX SNAX STORE
